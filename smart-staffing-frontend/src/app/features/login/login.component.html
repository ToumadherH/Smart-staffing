<div class="login-page">
  <section class="login-form-panel">
    <div class="form-container">
      <header class="form-header">
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to manage your AI talent pipeline.</p>
      </header>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-with-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input id="email" type="email" formControlName="email" placeholder="you@company.com">
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="mailto:hr@dpc.com" class="forgot-link">Forgot password?</a>
          </div>
          <div class="input-with-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••••">
            <button type="button" class="eye-btn" (click)="toggleShowPassword()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                @if (showPassword) {
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                } @else {
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                }
              </svg>
            </button>
          </div>
        </div>

        @if (error) {
          <div class="error-alert">
            {{ error }}
          </div>
        }

        <div class="remember-row">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="remember">
            <span>Remember me for 30 days</span>
          </label>
        </div>

        <button type="submit" class="btn-primary submit-btn" [disabled]="loading">
          {{ loading ? 'Signing in…' : 'Sign In' }}
        </button>
      </form>

      <footer class="form-footer">
        <p>Don't have an account? <a href="mailto:hr@dpc.com">Request access</a></p>
      </footer>
    </div>
  </section>

  <aside class="brand-panel">
    <div class="brand-content">
      <img src="assets/logo.png" alt="Smart Staffing Platform" class="brand-logo">
      <h2>Precision Talent Matching</h2>
      <p>Leverage advanced AI algorithms to connect top-tier candidates with enterprise roles seamlessly and securely.</p>
    </div>
  </aside>
</div>
