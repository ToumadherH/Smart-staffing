spring.application.name=smart-staffing-backend

# --- Database connection ---
# Values come from environment variables. The part after ':' is a fallback default.
# DB_PASSWORD has no default on purpose: the app must not know any real password.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_staffing}
spring.datasource.username=${DB_USERNAME:smart_staffing_user}
spring.datasource.password=${DB_PASSWORD:123456}

# --- JPA / Hibernate ---
# 'update' lets Hibernate create/alter tables from the entities. Fine for development only.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Closes the database session at the end of the service call instead of the HTTP response.
# Forces us to load what we need inside the service, which avoids surprise lazy-loading errors.
spring.jpa.open-in-view=false

# --- Seeded HR member account (development only) ---
# There is no registration endpoint, so this is the only way to log in locally.
# Override both via env vars for anything beyond local development.
hr.seed.email=${HR_SEED_EMAIL:hr@dpc.com}
hr.seed.password=${HR_SEED_PASSWORD:ChangeMe123!}

# Local filesystem directory for Sprint 1 CV uploads. Keep this outside Git.
cv.storage.location=${CV_STORAGE_LOCATION:uploads/cvs}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
